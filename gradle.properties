# Keep the Gradle daemon alive for 1 hour (default is 3 hours but it gets killed on low memory).
# This avoids the 60-90s cold rebuild on every deploy session.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000

# Give the daemon enough heap to avoid GC pressure killing it mid-session.
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError
