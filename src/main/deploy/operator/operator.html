<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Interface - Team 5142</title>
    <link rel="stylesheet" href="operator.css">
</head>
<body>
    <div id="interface-wrapper">

        <!-- Status bar: connection and alliance -->
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-light" id="connection-light"></div>
                <span>Robot</span>
            </div>
            <div class="status-indicator">
                <div class="status-light" id="enabled-light"></div>
                <span>Enabled</span>
            </div>
            <div id="alliance-badge" class="alliance-badge">BLUE</div>
        </div>

        <!-- Field image with click-to-set-target overlay -->
        <div class="field-container" id="field-container">
            <img id="field-image" class="field-image" src="field_blue.jpg" alt="Field" draggable="false" />

            <!-- Red outline showing the full clickable field region (calibration aid - remove when tuned) -->
            <div id="debug-field-bounds" class="debug-field-bounds"></div>

            <!-- Yellow outline showing the safety-padded region where targets are actually allowed -->
            <div id="debug-safe-bounds" class="debug-safe-bounds"></div>

            <!-- Dot shows the staged (not-yet-confirmed) click location -->
            <div id="pending-dot" class="pending-dot" style="display:none;"></div>

            <!-- Confirmed target markers -->
            <div id="marker-left"  class="target-marker marker-left"  style="display:none;"><span>L</span></div>
            <div id="marker-right" class="target-marker marker-right" style="display:none;"><span>R</span></div>
        </div>

        <!-- Action buttons -->
        <div class="action-container">
            <button class="action-button set-btn" id="btn-set-left"  data-side="left">SET LEFT<br>TARGET</button>
            <button class="action-button set-btn" id="btn-set-right" data-side="right">SET RIGHT<br>TARGET</button>
            <button class="action-button reset-btn" id="btn-reset-left"  data-side="left">RESET LEFT</button>
            <button class="action-button reset-btn" id="btn-reset-right" data-side="right">RESET RIGHT</button>
        </div>

        <!-- Status / feedback -->
        <div class="message-box" id="message-box">Ready</div>

        <button class="fullscreen-toggle" id="fullscreen-btn">FS</button>
    </div>

    <script src="nt4.js"></script>
    <script src="operator.js"></script>
</body>
</html>
</body>
</html>
